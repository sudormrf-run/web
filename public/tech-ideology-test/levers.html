<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다섯 개의 레버 — 기술 사상검증구역</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#111417; --panel:#191d21; --panel-2:#14181b; --line:#2b3238; --line-soft:#22282d;
  --ink:#EAE7DE; --muted:#94a0a8; --dim:#5c676f;
  --accent:#FF5A1F; --accent-dim:#c9440f;
  --paper:#EDEAE1; --paper-line:#c9c4b4; --paper-ink:#17191c; --paper-dim:#6d6a5e;
  --disp:'Black Han Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans KR',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
b,strong{font-weight:700}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px}
.site-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line-soft)}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--muted)}
.brand b{color:var(--ink);font-weight:500}
.head-link{font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none}
.head-link:hover{color:var(--accent)}
.slab{display:flex;align-items:baseline;gap:14px;font-family:var(--mono);font-size:12px;letter-spacing:.18em}
.slab span{color:var(--accent)}
.slab b{color:var(--muted);font-weight:500}
/* ── hero ── */
.hero{padding:60px 0 54px;border-bottom:1px solid var(--line-soft)}
.hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(40px,7.4vw,84px);line-height:1.05;margin:18px 0 20px;letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:40em;color:var(--muted);font-size:17px;margin:0 0 12px}
.hero p strong{color:var(--ink)}
.jump{display:flex;flex-wrap:wrap;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-top:34px}
.jump a{flex:1 1 150px;background:var(--panel-2);padding:14px 16px;text-decoration:none;transition:background .14s}
.jump a:hover{background:#1e2429}
.jump small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--dim)}
.jump b{font-family:var(--disp);font-weight:400;font-size:20px;display:block;margin-top:5px}
.jump i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
/* ── lever section ── */
.lever{padding:56px 0 8px;border-bottom:1px solid var(--line-soft)}
.lever-head{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.lever-no{font-family:var(--disp);font-size:clamp(46px,7vw,74px);line-height:.86;color:transparent;-webkit-text-stroke:1px var(--line);user-select:none}
.lever-title h2{font-family:var(--disp);font-weight:400;font-size:clamp(28px,4vw,42px);line-height:1.1;margin:0}
.lever-title h2 i{font-style:normal;font-family:var(--mono);font-size:.42em;color:var(--dim);vertical-align:.34em;margin-left:12px;letter-spacing:.06em}
.lever-ask{color:var(--muted);font-size:15.5px;max-width:44em;margin:10px 0 0}
.lever-note{color:var(--dim);font-size:13px;max-width:44em;margin:8px 0 0}
.poles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin:30px 0 0}
.pole{background:var(--panel-2);padding:0 0 20px}
.pole-head{padding:16px 18px 14px;border-bottom:1px solid var(--line-soft);position:relative;overflow:hidden}
.pole-head .hatch{position:absolute;inset:0;opacity:.16;pointer-events:none}
.pole.l .hatch{background:repeating-linear-gradient(-55deg,var(--ink) 0 1px,transparent 1px 7px)}
.pole.r .hatch{background:repeating-linear-gradient(55deg,var(--ink) 0 1px,transparent 1px 7px)}
.pole-head small{position:relative;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);display:block}
.pole-head .nm{position:relative;display:flex;align-items:baseline;gap:10px;margin-top:6px}
.pole-head .nm b{font-family:var(--disp);font-weight:400;font-size:27px;line-height:1}
.pole-head .nm i{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--accent)}
.pole-head p{position:relative;margin:8px 0 0;font-size:14px;color:var(--muted)}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 13px;padding:20px 18px 0}
.face figure{margin:0}
.face .ph{position:relative;aspect-ratio:4/5;background:#0d1012;border:1px solid var(--line);overflow:hidden}
.face .ph img{width:100%;height:100%;object-fit:cover;object-position:center 22%;filter:grayscale(1) contrast(1.08) brightness(.94);transition:filter .2s}
.face:hover .ph img{filter:grayscale(0) contrast(1) brightness(1)}
.face .ph .echo{position:absolute;left:0;bottom:0;background:var(--accent);color:#16100c;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:2px 6px;line-height:1.5}
.face b{display:block;font-size:13.5px;margin-top:9px;line-height:1.3}
.face em{font-style:normal;display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.02em;margin-top:2px}
.face p{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
.face p .q{color:var(--ink)}
/* ── example questions ── */
.qdemo{margin:26px 0 44px;border:1px solid var(--line-soft);background:var(--panel-2)}
.qdemo .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim)}
.qrow{display:grid;grid-template-columns:1fr 210px;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.qrow:last-child{border-bottom:0}
.qrow .t{font-size:15px;line-height:1.5}
.qrow .t u{text-decoration:none;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-right:9px}
.qrow .t .rev{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--accent-dim);border:1px solid var(--accent-dim);padding:1px 6px 2px;margin-left:8px;line-height:1.35;white-space:nowrap;vertical-align:middle}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--mono);font-size:12px}
.ox div{border:1px solid var(--line);padding:7px 9px;display:flex;align-items:baseline;gap:8px}
.ox div b{font-family:var(--disp);font-weight:400;font-size:16px;color:var(--dim)}
.ox div span{color:var(--muted)}
.ox div.on{border-color:var(--accent-dim)}
.ox div.on b{color:var(--accent)}
.ox div.on span{color:var(--ink)}
/* ── code table ── */
.codes{padding:56px 0 20px}
.codes h2{font-family:var(--disp);font-weight:400;font-size:clamp(26px,3.6vw,38px);margin:16px 0 10px}
.codes>p{color:var(--muted);max-width:44em;margin:0 0 4px;font-size:15px}
.tablewrap{overflow-x:auto;margin-top:28px;border:1px solid var(--line-soft)}
table{border-collapse:collapse;width:100%;min-width:720px;background:var(--panel-2)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;white-space:nowrap}
thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);font-weight:400;background:#161a1e;position:sticky;top:0}
tbody tr:hover{background:#171c20}
.who{display:flex;align-items:center;gap:10px;min-width:170px}
.who img{width:34px;height:34px;object-fit:cover;object-position:center 20%;border:1px solid var(--line);filter:grayscale(1) contrast(1.08)}
.who b{font-weight:500;font-size:13.5px}
.who em{font-style:normal;display:block;font-family:var(--mono);font-size:10px;color:var(--dim)}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chip.both{color:var(--accent);font-weight:500}
.chip.none{color:#3c454b}
td.why{white-space:normal;min-width:260px;font-size:12.5px;color:var(--dim);line-height:1.5}
.codes .after{margin-top:18px;font-size:13.5px;color:var(--muted);max-width:48em}
.codes .after b{color:var(--ink)}
/* ── foot ── */
.foot{padding:44px 0 80px;border-top:1px solid var(--line-soft);margin-top:44px}
.foot h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:400;margin:0 0 12px}
.foot p{font-size:12.5px;color:var(--dim);max-width:56em;margin:0 0 10px}
.credits{font-size:11.5px;color:#4e585f;line-height:1.8;margin:0}
.credits a{color:#69757c}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 34px}
.btn{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border:1px solid var(--line);font-family:var(--mono);font-size:14px;letter-spacing:.1em;text-decoration:none;transition:border-color .15s,background .15s}
.btn--go{background:var(--accent);border-color:var(--accent);color:#16100c;font-weight:500}
.btn--go:hover{background:#ff6c36}
.btn--ghost:hover{border-color:var(--muted)}
@media(max-width:1000px){
  .faces{grid-template-columns:repeat(2,1fr);gap:18px 14px}
}
@media(max-width:860px){
  .poles{grid-template-columns:1fr}
  .faces{grid-template-columns:repeat(4,1fr)}
  .qrow{grid-template-columns:1fr}
  .lever-no{font-size:40px}
}
@media(max-width:620px){
  .faces{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header class="site-head">
  <div class="brand"><b>sudoremove</b> — 기술 사상검증구역</div>

<main id="app" class="wrap"></main>

<script>
'use strict';
/* 극별 인물·문안 SoT = vault 260906_sudoremove_tech_ideology_test.md G절(Pole Cards) · 7절(Guess the Code).
   사진 = Wikimedia Commons, 라이선스는 하단 크레딧. */

const P = {
  altman:['샘 올트먼','Sam Altman'], andreessen:['마크 앤드리슨','Marc Andreessen'],
  lecun:['얀 르쿤','Yann LeCun'], amodei:['다리오 아모데이','Dario Amodei'],
  hinton:['제프리 힌턴','Geoffrey Hinton'], sutskever:['일리야 수츠케버','Ilya Sutskever'],
  zuckerberg:['마크 저커버그','Mark Zuckerberg'], musk:['일론 머스크','Elon Musk'],

  thiel:['피터 틸','Peter Thiel'], nadella:['사티아 나델라','Satya Nadella'],
  hassabis:['데미스 하사비스','Demis Hassabis'], bezos:['제프 베조스','Jeff Bezos'],
  buterin:['비탈릭 부테린','Vitalik Buterin'], torvalds:['리누스 토르발스','Linus Torvalds'],
  jobs:['스티브 잡스','Steve Jobs'], graham:['폴 그레이엄','Paul Graham'],
  friedman:['밀턴 프리드먼','Milton Friedman'], karp:['알렉스 카프','Alex Karp'],
  tesla:['니콜라 테슬라','Nikola Tesla'], yudkowsky:['엘리에저 유드코프스키','Eliezer Yudkowsky'],
  chung:['정주영','Chung Ju-yung'], leekunhee:['이건희','Lee Kun-hee'],
  son:['손정의','Masayoshi Son'], edison:['토머스 에디슨','Thomas Edison'],
  smith:['애덤 스미스','Adam Smith'],
  keynes:['존 메이너드 케인스','J. M. Keynes'],
};

/* 레버 5개. L = 왼쪽 극, R = 오른쪽 극. people = [slug, 근거 한 줄, 표시]
   표시: true = 다른 레버에도 나오는 사람(배지 없음) · 문자열 = 그 문구로 배지를 단다(같은 레버 양쪽에 선 경우) */
const LEVERS = [
{ no:'01', id:'spd', name:'속도', ask:'위험이 확인되기 전에 만드는가, 통제가 확인된 뒤에 만드는가.',
  note:'다섯 레버 중 실제 진영 이름이 붙은 유일한 축이다 — e/acc(가속)와 decel(제동)은 서로를 부르며 만들어진 이름이라, 사람들이 스스로를 그렇게 부른다.',
  L:{c:'A',ko:'가속',en:'ACCEL',line:'위험이 확인되기 전에 만든다.',people:[
    ['altman','2024년 「The Intelligence Age」에서 초지능이 <span class="q">"a few thousand days"</span> 안에 온다고 썼다. 위험 성명에 서명하면서도 스케일링은 멈추지 않는다.'],
    ['andreessen','2023년 Techno-Optimist Manifesto에서 안전주의·사전예방원칙·리스크 관리를 <span class="q">"적"</span> 목록에 그대로 적었다.'],
    ['lecun','2023년 Munk Debate에서 "AI는 실존 위협인가"에 <span class="q">반대 측</span>으로 섰다. 지금의 위험론은 과장이라는 쪽.'],
    ['chung','<span class="q">"이봐, 해봤어?"</span> 조선소를 짓기도 전에 배를 먼저 팔았다. 확인되기 전에 만드는 태도의 한국 원형.'],
  ]},
  R:{c:'D',ko:'제동',en:'DECEL',line:'통제가 확인된 뒤에 만든다.',people:[
    ['amodei','Anthropic을 안전을 앞세워 세웠다. 위험한 능력은 배포 전에 시험한다는 원칙 — <span class="q">"만들지 말자"가 아니라 "통제법을 먼저"</span>.'],
    ['hinton','2023년 구글을 나와 AI 위험을 경고했다. <span class="q">"내가 안 했어도 누군가 했을 것"</span>이라는 변명으로 자신을 달랬다고 말했다.'],
    ['sutskever','2024년 SSI를 세우며 <span class="q">"첫 제품은 안전한 초지능"</span>이라고 했다. 그 전까지는 아무 제품도 내지 않는다.'],
    ['yudkowsky','2023년 TIME 기고 <span class="q">"Shut it all down"</span>. 대형 학습 클러스터를 조약으로 금지하자고까지 썼다.'],
  ]},
  qs:[{n:6,t:'내 부모의 간병을 로봇에게 맡길 수 있다.',rev:false},
      {n:8,t:'사람보다 똑똑한 AI는 통제 방법이 확인되기 전까지 만들지 말아야 한다.',rev:true}] },

{ no:'02', id:'opn', name:'공개', ask:'만든 것 — 가중치·데이터·논문·특허 — 을 밖에 내놓는가, 쥐고 있는가.',
  note:'무엇을 공개하느냐만 묻는다. 국경을 넘기느냐는 다음 레버(주권)로 보낸다.',
  L:{c:'O',ko:'개방',en:'OPEN',line:'만든 것을 밖에 내놓는다.',people:[
    ['zuckerberg','2024년 <span class="q">"Open Source AI Is the Path Forward"</span>. Llama 가중치를 풀어 오픈웨이트 진영의 대표가 됐다.'],
    ['lecun','오픈소스가 AI를 더 안전하고 다양하게 만든다며 폐쇄 랩들을 계속 비판해 왔다.',true],
    ['musk','2024년 Grok-1 가중치를 <span class="q">Apache 2.0</span>으로 공개했다. OpenAI가 "닫힌 AI"가 됐다며 소송도 냈다.'],
    ['torvalds','1991년 Linux를 공개 라이선스로 풀었다. 세계의 서버와 안드로이드가 그 위에서 돈다.'],
  ]},
  R:{c:'P',ko:'폐쇄',en:'PROPRIETARY',line:'만든 것을 쥐고 있다.',people:[
    ['sutskever','2023년 GPT-4 비공개를 두고 <span class="q">"We were wrong"</span>. 강력해질 것이라 믿는다면 오픈소스는 말이 안 된다는 쪽으로 돌아섰다.',true],
    ['amodei','Anthropic은 가중치를 공개하지 않는다. 능력이 위험할수록 공개를 줄인다.',true],
    ['gates','1976년 「Open Letter to Hobbyists」 — <span class="q">소프트웨어를 복사해 쓰는 건 도둑질</span>이다. 상용 소프트웨어의 출발점.'],
    ['jobs','앱 심사·부품·OS를 전부 통제하는 닫힌 생태계를 만들었다. 열지 않아서 품질을 지켰다는 쪽.'],
  ]},
  qs:[{n:13,t:'논문을 내지 않는 회사는 학계에 무임승차하는 것이다.',rev:false},
      {n:18,t:'모델 가중치를 공개하는 것은 무기를 푸는 것과 다르지 않다.',rev:true}] },

{ no:'03', id:'sov', name:'주권', ask:'기술은 국경 없이 최적을 고르면 되는 상품인가, 국가가 확보해야 할 것인가.',
  note:'정부의 크기가 아니라 단위를 묻는다 — 그래서 좌우 정치를 가로지른다. 한국 응답자에게는 NVIDIA 의존·독자 모델·지도 반출·KPS가 그대로 이 레버다.',
  L:{c:'M',ko:'시장',en:'MARKET',line:'국경 없이 최적을 고르면 되는 상품이다.',people:[
    ['andreessen','선언문 <span class="q">"We believe in free markets"</span>. 기술을 배분하는 것은 정부가 아니라 시장이라는 쪽.',true],
    ['huang','2025년 Computex <span class="q">"Export control was a failure"</span>. 중국에 칩을 못 팔게 한 것은 미국 기업만 손해였다고 했다.'],
    ['friedman','1970년 <span class="q">"기업의 사회적 책임은 이윤을 늘리는 것"</span>. 국가 주도 육성과 산업정책에 반대한 경제학의 얼굴.'],
    ['smith','1776년 <span class="q">"보이지 않는 손"</span>. 원본 시즌2 결과 카드 제목 "YOUR INVISIBLE HAND"가 여기서 왔다.'],
  ]},
  R:{c:'S',ko:'주권',en:'SOVEREIGN',line:'국가가 확보해야 할 것이다.',people:[

function face(slug, why, echo){
  const [ko,en] = P[slug];
  const tag = typeof echo==='string' ? echo : '';   // true = 다른 레버에도 등장(배지 없음)
  return `<div class="face"><figure>
    <div class="ph"><img src="assets/people/${slug}.jpg" alt="${ko}" loading="lazy" width="132" height="165">${tag?`<span class="echo">${tag}</span>`:''}</div>
    <b>${ko}</b><em>${en}</em><p>${why}</p>
  </figure></div>`;
}
function pole(side, p){
  return `<div class="pole ${side}">
    <div class="pole-head"><span class="hatch" aria-hidden="true"></span>
      <small>${side==='l'?'왼쪽 극':'오른쪽 극'} · ${p.en}</small>
      <div class="nm"><b>${p.ko}</b><i>${p.c}</i></div>
      <p>${p.line}</p>
    </div>
    <div class="faces">${p.people.map(x=>face(x[0],x[1],x[2])).join('')}</div>
  </div>`;
}
function qdemo(lv){
  return `<div class="qdemo">
    <div class="hd"><span>실제 문항에서는 이렇게 나온다</span><span>${lv.name} · 45문항 중 2개</span></div>
    ${lv.qs.map(q=>{
      const oPole = q.rev ? lv.R : lv.L, xPole = q.rev ? lv.L : lv.R;
      return `<div class="qrow">
        <div class="t"><u>Q${q.n}.</u>${q.t}${q.rev?'<span class="rev">역</span>':''}</div>
        <div class="ox">
          <div class="on"><b>O</b><span>${oPole.ko} ${oPole.c}</span></div>
          <div><b>×</b><span>${xPole.ko} ${xPole.c}</span></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function chip(v){
  if(!v) return '<span class="chip none">—</span>';
  if(v==='양쪽') return '<span class="chip both">양쪽</span>';
  return `<span class="chip">${v}</span>`;
}
