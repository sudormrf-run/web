<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기술 사상검증구역</title>
<meta name="description" content="AI·로보틱스 판에서 우리는 왜 서로 다른 답을 말하는가. 레버 다섯 개를 묻는 45문항 O/X 테스트 — 약 3분, 결과는 코드 다섯 자리.">
<meta property="og:type" content="website">
<meta property="og:title" content="기술 사상검증구역">
<meta property="og:description" content="레버 다섯 개 — 속도·공개·주권·수혜·가치. 45문항 O/X, 약 3분. 당신의 코드는?">
<meta property="og:image" content="/sudormrf.jpg">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#111417; --panel:#191d21; --panel-2:#14181b; --line:#2b3238; --line-soft:#22282d;
  --ink:#EAE7DE; --muted:#94a0a8; --dim:#5c676f;
  --accent:#FF5A1F; --accent-dim:#c9440f;
  --paper:#EDEAE1; --paper-line:#c9c4b4; --paper-ink:#17191c; --paper-dim:#6d6a5e;
  --disp:'Black Han Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans KR',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
b,strong{font-weight:700}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px}
/* ── header ── */
.site-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line-soft)}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--muted)}
.brand b{color:var(--ink);font-weight:500}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--line-soft)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
/* ── section label ── */
.slab{display:flex;align-items:baseline;gap:14px;font-family:var(--mono);font-size:12px;letter-spacing:.18em}
.slab span{color:var(--accent)}
.slab b{color:var(--muted);font-weight:500}
/* ── intro ── */
.intro{padding:64px 0 80px}
.intro h1{font-family:var(--disp);font-weight:400;font-size:clamp(44px,8vw,92px);line-height:1.04;margin:18px 0 20px;letter-spacing:-.01em;text-wrap:balance}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro .lede{max-width:38em;color:var(--muted);font-size:17px;margin:0 0 8px}
.intro .lede strong{color:var(--ink)}
.axes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin:44px 0 0}
.axis-card{background:var(--panel-2);padding:20px 18px 18px}
.axis-card small{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);display:block}
.axis-card small em{font-style:normal;color:var(--accent-dim)}
.axis-card .pair{display:flex;align-items:baseline;gap:10px;margin:10px 0 8px;font-family:var(--disp);font-size:24px;line-height:1}
.axis-card .pair i{font-style:normal;color:var(--dim);font-family:var(--mono);font-size:14px}
.axis-card .pair .l{color:var(--ink)} .axis-card .pair .r{color:var(--muted)}
.axis-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}
.axis-card.eye{background:#171b1f;border-top:2px solid var(--accent-dim)}
.meta-row{display:flex;flex-wrap:wrap;gap:10px 26px;margin:30px 0 0;font-family:var(--mono);font-size:13px;color:var(--muted)}
.meta-row b{color:var(--ink);font-weight:500}
.start-row{margin-top:40px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:14px;padding:16px 26px;border:1px solid var(--line);font-family:var(--mono);font-size:14px;letter-spacing:.1em;transition:border-color .15s,background .15s}
.btn b{font-weight:400}
.btn--go{background:var(--accent);border-color:var(--accent);color:#16100c;font-weight:500}
.btn--go:hover{background:#ff6c36}
.btn--ghost:hover{border-color:var(--muted)}
.notice{margin-top:56px;border-top:1px solid var(--line-soft);padding-top:20px;max-width:46em}
.notice p{margin:0 0 8px;font-size:12.5px;color:var(--dim)}
/* ── question ── */
.qscreen{position:relative;padding:56px 0 60px;min-height:62vh}
.ghost{position:absolute;top:8px;right:0;font-family:var(--disp);font-size:clamp(120px,22vw,260px);line-height:1;color:transparent;-webkit-text-stroke:1px var(--line);user-select:none;pointer-events:none}
.qmeta{display:flex;justify-content:space-between;align-items:baseline}
.kbd-hint{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.qtext{font-family:var(--disp);font-weight:400;font-size:clamp(30px,4.6vw,54px);line-height:1.22;margin:34px 0 8px;max-width:19em;position:relative;z-index:1;text-wrap:balance}
.qtext .qmark{color:var(--accent);font-family:var(--mono);font-size:.45em;vertical-align:.7em;margin-right:.6em;letter-spacing:0}
.answers{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-top:40px}
.answers button{display:grid;grid-template-rows:auto 1fr auto;gap:6px;justify-items:start;min-height:150px;padding:14px 18px;text-align:left;border:0;background:var(--panel-2);transition:background .12s}
.answers button + button{border-left:1px solid var(--line)}
.answers button small{font-family:var(--mono);font-size:11px;color:var(--dim)}
.answers button .mark{font-family:var(--disp);font-size:52px;line-height:1;justify-self:center;align-self:center;color:var(--ink)}
.answers button span{font-size:13px;color:var(--muted)}
.answers button:hover{background:#1e2327}
.answers button.sel{background:var(--accent)}
.answers button.sel .mark,.answers button.sel span,.answers button.sel small{color:#16100c}
.backrow{margin-top:26px}
.back{font-family:var(--mono);font-size:13px;color:var(--muted);padding:8px 0}
.back:disabled{color:var(--dim);cursor:default}
/* ── result ── */
.result{padding:56px 0 90px}
.res-card{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);padding:30px 30px 34px;margin-top:26px;box-shadow:10px 10px 0 var(--accent-dim)}
.res-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--paper-ink);padding-bottom:14px}
.res-head .slab span{color:var(--accent-dim)} .res-head .slab b{color:var(--paper-dim)}
.res-head>span{font-size:13px;color:var(--paper-dim)}
.res-body{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:36px;align-items:start;margin-top:30px}
.res-code{font-family:var(--disp);font-size:clamp(30px,4.2vw,48px);line-height:1;margin:0 0 6px;letter-spacing:.02em}
.res-code i{font-style:normal;color:var(--paper-dim);font-size:.5em;vertical-align:.28em;padding:0 .18em}
.res-sub{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--paper-dim);margin:0 0 24px}
.axis-read{display:grid;gap:0;border-top:1px solid var(--paper-line)}
.axis-row{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--paper-line)}
.axis-row small{font-family:var(--mono);font-size:11px;color:var(--paper-dim);letter-spacing:.1em}
.axis-row .who em{font-style:normal;font-size:12.5px;color:var(--paper-dim);margin-right:6px}
.axis-row .who b{font-family:var(--disp);font-weight:400;font-size:21px}
.axis-row .pts{font-family:var(--disp);font-size:26px;line-height:1}
.axis-row .pts em{font-style:normal;font-size:12px;font-family:var(--body);color:var(--paper-dim)}
.axis-row.hot .pts{color:var(--accent-dim)}
.symwrap{justify-self:center;display:grid;gap:10px;justify-items:center}
.symwrap figcaption{font-family:var(--mono);font-size:11px;color:var(--paper-dim);letter-spacing:.12em}
/* split bars */
.splits{margin-top:34px;border-top:2px solid var(--paper-ink);padding-top:6px}
.split-row{display:grid;grid-template-columns:76px 1fr 76px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--paper-line)}
.split-row .pole{font-size:13px}
.split-row .pole b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--paper-dim);margin:0 4px}
.split-row .pole.r{text-align:right}
.split-row .pole.win{font-weight:700}
.track{position:relative;height:22px;display:flex;border:1px solid var(--paper-ink);background:var(--paper)}
.track i{display:block;height:100%}
.track .l{background:var(--paper-ink)}
.track .r{background:repeating-linear-gradient(-55deg,var(--paper-ink) 0 1px,transparent 1px 5px)}
.track em{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-style:normal;font-family:var(--mono);font-size:11px;color:var(--paper-ink);background:var(--paper);border:1px solid var(--paper-line);padding:0 7px;line-height:1.5;white-space:nowrap}
.split-note{font-size:12px;color:var(--paper-dim);margin:10px 0 0}
/* ── 전체 응답 통계 (수집기 /stats) ── */
.stats-card{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);
  padding:26px 30px 30px;margin-top:22px}
.stats-card .res-head{margin-bottom:22px}
.stats-lead{display:flex;gap:26px;align-items:stretch;flex-wrap:wrap;
  border-bottom:1px solid var(--paper-line);padding-bottom:20px;margin-bottom:20px}
.stats-hero{flex:0 0 auto;padding-right:26px;border-right:1px solid var(--paper-line)}
.stats-hero .cap{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--paper-dim)}
.stats-hero .fig{font-family:var(--disp);font-weight:400;font-size:44px;line-height:1.05;margin-top:6px;color:var(--accent-dim)}
.stats-hero .fig small{font-family:var(--body);font-size:15px;color:var(--paper-dim);font-weight:400}
.stats-lead p{font-size:14px;line-height:1.7;align-self:center;margin:0;flex:1 1 16em;min-width:15em;color:var(--paper-ink)}
.stats-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px;
  font-family:var(--mono);font-size:11.5px;color:var(--paper-dim)}
.stats-legend .grp{display:flex;align-items:center;gap:7px}
.stats-legend i{display:block;width:22px;height:11px;border-radius:2px}
.stats-legend .ttl{letter-spacing:.14em;color:var(--paper-ink)}
.stats-plot{overflow-x:auto;margin:0 -2px}
.stats-card svg{display:block;width:100%;min-width:600px;height:auto}
.stats-note{font-size:12px;color:var(--paper-dim);margin:14px 0 0;border-top:1px solid var(--paper-line);padding-top:12px;line-height:1.65}
.stats-note b{color:var(--paper-ink)}
@media(max-width:620px){
  .stats-card{padding:20px 16px 22px}
  .stats-hero{border-right:0;padding-right:0}
}
/* share */
.share{margin-top:44px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.share .hint{font-family:var(--mono);font-size:12px;color:var(--dim)}
.foot{margin-top:60px;border-top:1px solid var(--line-soft);padding-top:20px}
.foot p{font-size:12.5px;color:var(--dim);max-width:52em;margin:0 0 8px}
[hidden]{display:none!important}
@media(max-width:760px){
  .res-body{grid-template-columns:1fr}
  .symwrap{justify-self:start}
  .answers button{min-height:120px}
}
</style>
</head>
<body>
<header class="site-head">
  <div class="brand"><b>sudoremove</b> — 기술 사상검증구역</div>
  <div class="counter" id="counter"></div>
</header>
<div class="progress"><i id="pbar"></i></div>

<main id="app" class="wrap"></main>

<script>
'use strict';
/* ───────── data ─────────
   5축. 왼쪽 묶음 = 가속·개방·시장·첨단·역량, 오른쪽 = 제동·폐쇄·주권·보편·효용 (원형: 안드리센 ↔ 아모데이).
   순서 = 진영 이름이 있는 순: 속도 → 공개 → 주권 → 수혜 → 가치. 레버 다섯 — 앞 넷은 손이 닿는 레버, 다섯째(가치)는 그 손이 기술을 보는 눈이라 eye 표시를 단다.
   기획 SoT = vault 260906_sudoremove_tech_ideology_test.md (5절 · Part II D/F). */
const AXES = {
  spd:{name:'속도', L:{c:'A',ko:'가속',en:'ACCEL'},      R:{c:'D',ko:'제동',en:'DECEL'},       ask:'위험이 확인되기 전에 만드는가, 통제가 확인된 뒤에 만드는가.'},
  opn:{name:'공개', L:{c:'O',ko:'개방',en:'OPEN'},       R:{c:'P',ko:'폐쇄',en:'PROPRIETARY'}, ask:'만든 것 — 가중치·데이터·논문·특허 — 을 밖에 내놓는가, 쥐고 있는가.'},
  sov:{name:'주권', L:{c:'M',ko:'시장',en:'MARKET'},     R:{c:'S',ko:'주권',en:'SOVEREIGN'},   ask:'기술은 국경 없이 최적을 고르면 되는 상품인가, 국가가 확보해야 할 것인가.'},
  ben:{name:'수혜', L:{c:'F',ko:'첨단',en:'FRONTIER'},   R:{c:'U',ko:'보편',en:'UNIVERSAL'},   ask:'누구에게 이로워야 성공인가 — 최상단이 올라간 것으로 재는가, 평균이 올라간 것으로 재는가.'},
  val:{name:'가치', eye:true, L:{c:'C',ko:'역량',en:'CAPABILITY'}, R:{c:'W',ko:'효용',en:'WANT'},        ask:'기술의 가치는 어디서 오는가 — 할 수 있어서인가, 쓰여서인가.'},
};
const AXIS_ORDER = ['spd','opn','sov','ben','val'];
/* p = '그렇다'가 가리키는 극. 각 축 블록은 정방향(L)이 앞, 역(R)이 뒤. 번호 = 출제본 D절 번호(제외분은 빈 번호로 남긴다). */
const Q = [
 /* ① 속도 — 가속 A ↔ 제동 D (9문항, 역 3 · 7 제외) */
 {n:1,  a:'spd',p:'L',t:'전문가 절반이 위험하다고 말하는 기술이라도 실제 사고가 나기 전까지는 만들어야 한다.'},
 {n:2,  a:'spd',p:'L',t:'안전 연구는 실질적으로 개발을 늦추기 위한 명분으로 쓰인다.'},
 {n:3,  a:'spd',p:'L',t:'AI가 인류를 멸종시킬 수 있다는 주장은 과장됐다.'},
 {n:4,  a:'spd',p:'L',t:'자율주행이 사람보다 사고를 덜 낸다면, 사망 사고가 나더라도 도입을 늦춰서는 안 된다.'},
 {n:5,  a:'spd',p:'L',t:'AI 데이터센터 때문에 우리 집 전기요금이 20% 오르더라도 감수할 만한 비용이다.'},
 {n:6,  a:'spd',p:'L',t:'내 부모의 간병을 로봇에게 맡길 수 있다.'},
 {n:8,  a:'spd',p:'R',t:'사람보다 똑똑한 AI는 통제 방법이 확인되기 전까지 만들지 말아야 한다.'},
 {n:9,  a:'spd',p:'R',t:'내가 만든 소프트웨어가 콜센터 직원 열 명을 해고시켰다면 그 결과에 나도 책임이 있다.'},
 {n:10, a:'spd',p:'R',t:'유전자 편집으로 아기의 유전병을 고치는 기술은 안전성이 확인되기 전까지 어느 나라도 허용하면 안 된다.'},
 /* ② 공개 — 개방 O ↔ 폐쇄 P (9문항, 역 4 · 12 제외) */
 {n:11, a:'opn',p:'L',t:'기술의 진짜 혁신은 오픈소스에서 나온다.'},
 {n:13, a:'opn',p:'L',t:'논문을 내지 않는 회사는 학계에 무임승차하는 것이다.'},
 {n:14, a:'opn',p:'L',t:'특허 제도는 지금 혁신을 돕기보다 막고 있다.'},
 {n:15, a:'opn',p:'L',t:'유튜브·인스타그램 같은 플랫폼은 추천 알고리즘을 공개할 의무가 있다.'},
 {n:16, a:'opn',p:'L',t:'회사에서 배운 기술을 개인 블로그나 발표로 공유하는 것은 유출이 아니라 홍보다.'},
 {n:17, a:'opn',p:'R',t:'AI 회사는 학습에 쓴 그림·글·코드의 원작자에게 대가를 지불해야 한다.'},
 {n:18, a:'opn',p:'R',t:'모델 가중치를 공개하는 것은 무기를 푸는 것과 다르지 않다.'},
 {n:19, a:'opn',p:'R',t:'경쟁사가 따라 할 수 있는 것은 공개하지 않는 게 맞다.'},
 {n:20, a:'opn',p:'R',t:'자율주행 사고의 주행 기록은 제조사 내부 자료라 공개할 의무가 없다.'},
 /* ③ 주권 — 시장 M ↔ 주권 S (9문항, 역 5 · 22 제외) */
 {n:21, a:'sov',p:'L',t:'미국이 GPU 수출을 막아도 중국의 AI 발전은 결국 막지 못한다.'},
 {n:23, a:'sov',p:'L',t:'학습·추론용 반도체를 100% NVIDIA에 의존하더라도, 그 위에서 세계 최고 AI를 만들면 한국은 AI 주권을 가진 것이다.'},
 {n:24, a:'sov',p:'L',t:'미국·중국 모델을 쓰면 충분하다. 자체 모델은 낭비다.'},
 {n:25, a:'sov',p:'L',t:'인재가 해외로 나가는 것은 개인의 선택이지 국가의 손실이 아니다.'},
 {n:26, a:'sov',p:'R',t:'미국 GPS가 공짜로 잘 돌아가도 한국은 3조 7천억 원을 들여 자체 위성항법(KPS)을 가져야 한다.'},
 {n:27, a:'sov',p:'R',t:'기술 주권을 위해서라면 값이 두 배라도 국산을 써야 한다.'},

/* 고정 출제 순서 (gen_order.py, seed 260906) — 45문항, 같은 축 연속 없음. 테마별 블록 출제는 축 의도가 읽히므로 금지.
   응답 비교를 위해 사용자별 셔플도 하지 않는다. 문항 텍스트가 바뀌면 QSET을 bump한다. */
const DISPLAY = [48,1,15,36,19,40,25,38,11,3,29,50,16,43,9,30,34,26,18,33,8,17,35,21,10,23,44,6,32,14,28,2,41,13,42,24,20,4,46,5,27,37,47,39,49].map(n=>'q'+n);
const TEXT = {};
Q.forEach(q=>TEXT['q'+q.n]=q.t);
const STEPS = DISPLAY.map(k=>({key:k}));
const N_Q = Q.length;          // 45
const PER_AXIS = 9;            // 축당 9문항 (홀수 — 동점 없음)
const HEX_LEN = 12;            // 45bit → 48bit(3bit 패딩) = 12 hex
const COLLECTOR = 'https://ideology.sudormrf.run';   // 응답 수집기 (collector/ — 우리 계정의 Worker + D1)
const QSET = 'v5';             // 5축 45문항, D절 문구 확정본 (2026-09-13). 문항 텍스트 변경 시 bump
const LS_KEY = 'tit-'+QSET+'-progress';

/* ───────── state ───────── */
let step = 0;               // index into STEPS
let ans = {};               // key 'q<n>' → 'O'|'X'
const app = document.getElementById('app');
const pbar = document.getElementById('pbar');
const counterEl = document.getElementById('counter');

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({step, ans})); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(v && v.ans){ ans=v.ans; step=Math.min(v.step|0, STEPS.length-1); return Object.keys(v.ans).length>0; } }catch(e){} return false; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ───────── scoring ─────────
   축당 9문항(홀수라 동점 없음). 격차 = |L−R|/9 %. 25% 이상(6:3부터)이면 강도 2 — 시즌2 원본 임계와 동일. 5:4는 11%로 강도 1. */
function score(){
  const per = {};
  for(const k of AXIS_ORDER) per[k] = {L:0,R:0};
  for(const q of Q){
    const v = ans['q'+q.n]; if(!v) continue;
    const side = (v==='O') ? q.p : (q.p==='L'?'R':'L');
    per[q.a][side]++;
  }
  const out = AXIS_ORDER.map(k=>{
    const {L,R} = per[k], ax = AXES[k];
    const win = L>=R ? 'L' : 'R';
    const gap = Math.abs(L-R)/PER_AXIS*100;             // % (문항 9개)
    return {k, ax, L, R, win, gap, code:ax[win].c, intensity: gap>=25?2:1};
  });
  return {axes:out, code:out.map(o=>o.code+o.intensity).join('·')};
}

/* ───────── URL hash 결과 인코딩 (Q 배열 순서로 45bit + 3bit 패딩 → 12 hex) ───────── */
function encodeAns(){
  let bits='';
  for(const q of Q) bits += ans['q'+q.n]==='O'?'1':'0';
  bits = bits.padEnd(HEX_LEN*4,'0');
  let hex='';
  for(let i=0;i<bits.length;i+=4) hex += parseInt(bits.slice(i,i+4),2).toString(16);
  return hex;
}
function decodeAns(hex){
  if(!new RegExp('^[0-9a-f]{'+HEX_LEN+'}$').test(hex)) return false;
  let bits='';
  for(const ch of hex) bits += parseInt(ch,16).toString(2).padStart(4,'0');
  ans={};
  Q.forEach((q,i)=>{ ans['q'+q.n] = bits[i]==='1'?'O':'X'; });
  return true;
}

/* ───────── 결과 심볼: 5단 모듈 스택 (기울기 = 극, 해칭 밀도 = 강도) ───────── */
function symbolSVG(axRes){
  const W=210, BH=44, GAP=8, PAD=6;
  const Hh = axRes.length*(BH+GAP)-GAP+PAD*2;
  let s = `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="결과 심볼: ${axRes.length}단 모듈 스택" xmlns="http://www.w3.org/2000/svg">`;
  axRes.forEach((r,bi)=>{
    const y = PAD + bi*(BH+GAP);
    const tilt = r.win==='L' ? -1 : 1;                 // 왼극 ↖ / 오른극 ↗
    const nLines = r.intensity===2 ? 11 : 5;
    const inkC = '#17191c', accC = '#c9440f';
    const eye = !!r.ax.eye;
    s += `<g><rect x="6" y="${y}" width="${W-12}" height="${BH}" fill="none" stroke="${inkC}" stroke-width="1.4"${eye?' stroke-dasharray="4 3"':''}/>`;
    const span = W-12, dx = span/(nLines+1), lean = 14*tilt;
    for(let i=1;i<=nLines;i++){
      const x = 6 + dx*i;
      s += `<line x1="${x-lean/2}" y1="${y+BH-4}" x2="${x+lean/2}" y2="${y+4}" stroke="${r.intensity===2?accC:inkC}" stroke-width="1.4"/>`;
    }
    s += `<text x="${W-14}" y="${y+BH/2+4}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="12" fill="${inkC}" style="paint-order:stroke" stroke="#EDEAE1" stroke-width="3">${r.code}${r.intensity}</text>`;
    s += `<text x="12" y="${y+BH/2+4}" font-family="IBM Plex Mono,monospace" font-size="9" letter-spacing="1" fill="#6d6a5e" style="paint-order:stroke" stroke="#EDEAE1" stroke-width="3">${r.ax.name}</text></g>`;
  });
  s += '</svg>';
  return s;
}

/* ───────── 전체 응답 통계 — 수집기 /stats를 받아 축별 좌우 분포를 그린다 ─────────
   테스트를 마친 사람이 자기 코드를 전체와 견주어 보라고 둔 자리다.
   수집기가 죽어 있거나 응답이 없으면 아무것도 그리지 않는다(결과 자체는 이미 나와 있다). */
const POLES = {                       // 코드 글자 → 축 인덱스·좌우
  A:[0,'L'],D:[0,'R'], O:[1,'L'],P:[1,'R'], M:[2,'L'],S:[2,'R'],
  F:[3,'L'],U:[3,'R'], C:[4,'L'],W:[4,'R'],
};
const SC = {L2:'#BF4310', L1:'#E39468', R1:'#5BAFDE', R2:'#15699F'};

function tallyCodes(rows){
  const per = AXIS_ORDER.map(()=>({}));
  let total = 0;
  for(const row of rows){
    const n = row.n|0; if(n<=0) continue;
    const cells = String(row.code).split('·');
    if(cells.length !== AXIS_ORDER.length) continue;
    let ok = true;
    cells.forEach((cell,i)=>{ const p = POLES[cell[0]]; if(!p || p[0]!==i) ok=false; });
    if(!ok) continue;
    total += n;
    cells.forEach((cell,i)=>{ per[i][cell] = (per[i][cell]||0) + n; });
  }
  return {per, total};
}

function statsSVG(per, total, mine){
  const W=920, PAD_T=22, ROW=46, GAP=13, PAD_B=26;
  const X_L=136, X_PLOT=150, PLOT=600, X_R=X_PLOT+PLOT+14;
  const CX=X_PLOT+PLOT/2, UNIT=(PLOT/2)/total, BAR=24;
  const H=PAD_T+AXIS_ORDER.length*(ROW+GAP)-GAP+PAD_B;
  const INK='#17191c', LINE='#c9c4b4', DIM='#6d6a5e', PAPER='#EDEAE1';
  const step = total<=10 ? Math.max(1,Math.ceil(total/3)) : Math.ceil(total/3);

  const bar=(x,w,y,fill,round,side)=>{
    if(w<=0.2) return '';
    const r=Math.min(3,w);
    if(!round) return `<rect x="${x}" y="${y}" width="${w}" height="${BAR}" fill="${fill}"/>`;
    return side<0
      ? `<path d="M${x+r},${y} H${x+w} V${y+BAR} H${x+r} A${r},${r} 0 0 1 ${x},${y+BAR-r} V${y+r} A${r},${r} 0 0 1 ${x+r},${y} Z" fill="${fill}"/>`
      : `<path d="M${x},${y} H${x+w-r} A${r},${r} 0 0 1 ${x+w},${y+r} V${y+BAR-r} A${r},${r} 0 0 1 ${x+w-r},${y+BAR} H${x} Z" fill="${fill}"/>`;
  };
  const num=(x,y,n,dark)=> n<=0 || n*UNIT<16 ? '' :
    `<text x="${x}" y="${y+BAR/2+4}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11.5" fill="${dark?PAPER:INK}">${n}</text>`;

  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="축별 좌우 극 분포 — 응답 ${total}건" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<g font-family="IBM Plex Mono,monospace" font-size="9.5" fill="${DIM}">`;
  for(let u=-total; u<=total; u+=step){
    const x=CX+u*UNIT, zero=u===0;
    s+=`<line x1="${x}" y1="${PAD_T-8}" x2="${x}" y2="${H-PAD_B+3}" stroke="${zero?INK:LINE}" stroke-width="${zero?1.5:1}"${zero?'':' stroke-dasharray="2 4"'}/>`;
    s+=`<text x="${x}" y="${H-PAD_B+17}" text-anchor="middle">${Math.abs(u)}</text>`;
  }
  s+='</g>';

  AXIS_ORDER.forEach((k,i)=>{
    const ax=AXES[k], t=per[i], y=PAD_T+i*(ROW+GAP), yb=y+(ROW-BAR)/2;
    const l2=t[ax.L.c+'2']||0, l1=t[ax.L.c+'1']||0, r1=t[ax.R.c+'1']||0, r2=t[ax.R.c+'2']||0;
    const lT=l1+l2, rT=r1+r2, win=lT>=rT?'L':'R';

    s+=`<text x="0" y="${yb+BAR/2+5}" font-family="Black Han Sans,sans-serif" font-size="16" fill="${INK}">${ax.name}</text>`;
    s+=`<text x="${X_L}" y="${yb+BAR/2+4}" text-anchor="end" font-size="12" font-family="IBM Plex Sans KR,sans-serif" font-weight="${win==='L'?700:400}" fill="${win==='L'?INK:DIM}">${ax.L.ko}</text>`;
    s+=`<text x="${X_R}" y="${yb+BAR/2+4}" font-size="12" font-family="IBM Plex Sans KR,sans-serif" font-weight="${win==='R'?700:400}" fill="${win==='R'?INK:DIM}">${ax.R.ko}</text>`;
    if(ax.eye) s+=`<rect x="${CX-total*UNIT-4}" y="${yb-4}" width="${2*total*UNIT+8}" height="${BAR+8}" fill="none" stroke="${LINE}" stroke-width="1.1" stroke-dasharray="4 3" rx="3"/>`;

    const xL1=CX-l1*UNIT, xL2=xL1-l2*UNIT, xR2=CX+r1*UNIT;
    s+=bar(xL1, l1*UNIT, yb, SC.L1, l2===0, -1);
    s+=bar(xL2, Math.max(0,l2*UNIT-2), yb, SC.L2, true, -1);
    s+=bar(CX, r1*UNIT, yb, SC.R1, r2===0, 1);
    s+=bar(xR2+2, Math.max(0,r2*UNIT-2), yb, SC.R2, true, 1);
    s+=num(xL1+l1*UNIT/2, yb, l1, false)+num(xL2+l2*UNIT/2, yb, l2, true);
    s+=num(CX+r1*UNIT/2, yb, r1, false)+num(xR2+r2*UNIT/2, yb, r2, true);

    // 내 위치 — 내가 속한 칸 위에 표식
    const cell=mine[i], mx={};
    mx[ax.L.c+'1']=xL1+l1*UNIT/2; mx[ax.L.c+'2']=xL2+l2*UNIT/2;
    mx[ax.R.c+'1']=CX+r1*UNIT/2;  mx[ax.R.c+'2']=xR2+r2*UNIT/2;
    if(mx[cell]!==undefined){
      const x=mx[cell];
      s+=`<path d="M${x-5},${yb-7} L${x+5},${yb-7} L${x},${yb-1} Z" fill="${INK}"/>`;
    }

    s+=`<text x="${W}" y="${yb+BAR/2+4}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11.5" fill="${DIM}">${lT} : ${rT}</text>`;
  });
  return s+'</svg>';
}

function renderStats(host, data, r){
  const rows = (data && data.codes) || [];
  const {per, total} = tallyCodes(rows);
  if(total < 1) return;
  const mine = r.axes.map(o=>o.code+o.intensity);
  const myCode = r.code;
  const same = rows.filter(x=>x.code===myCode).reduce((a,x)=>a+(x.n|0),0);
  const pct = Math.round(same/total*100);
  const uniq = rows.length;

  host.innerHTML = `
  <div class="stats-card">
    <div class="res-head">
      <div class="slab"><span>02</span><b>EVERYONE</b></div>
      <span>지금까지의 응답</span>
    </div>
    <div class="stats-lead">
      <div class="stats-hero">
        <div class="cap">나와 같은 코드</div>
        <div class="fig">${same>0 ? same+'<small> / '+total+'명</small>' : '<small style="font-size:22px">아직 나뿐</small>'}</div>
        <div class="cap" style="margin-top:6px">${myCode}${same>0 ? ' · '+pct+'%' : ' · '+total+'명 중 0명'}</div>
      </div>
      <p>${total}명이 남긴 코드는 서로 다른 것이 ${uniq}가지다.${same>0 ? '' : ' 같은 코드는 아직 없다 — 다섯 자리가 다 맞아야 같은 코드다.'} 아래는 그 응답을 축 다섯 개로 풀어 어느 쪽으로 기울었는지 본 것이고, <b>▼</b> 가 당신이 선 자리다.</p>
    </div>
    <div class="stats-legend">
      <span class="ttl">강도</span>
      <span class="grp"><i style="background:${SC.L2}"></i>왼쪽 2</span>
      <span class="grp"><i style="background:${SC.L1}"></i>왼쪽 1</span>
      <span class="grp"><i style="background:${SC.R1}"></i>오른쪽 1</span>
      <span class="grp"><i style="background:${SC.R2}"></i>오른쪽 2</span>
    </div>
    <div class="stats-plot">${statsSVG(per, total, mine)}</div>
    <p class="stats-note">가운데 세로선이 좌우 극의 경계다 — 선에서 멀수록 강도 2. 색은 어느 극인지만 가리키며 <b>좋고 나쁨을 뜻하지 않는다</b>.${total<30?' 아직 응답이 <b>'+total+'건</b>이라 경향으로 읽을 수치가 아니다.':''} 방금 낸 응답은 최대 1분 뒤 반영된다.</p>
  </div>`;
}

function loadStats(r){
  const host = document.getElementById('stats');
  if(!host) return;
  const base = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) ? '/api/stats' : COLLECTOR+'/stats';
  fetch(base+'?qset='+encodeURIComponent(QSET))
    .then(res=>res.ok?res.json():null)
    .then(data=>{ if(data) renderStats(host, data, r); })
    .catch(()=>{});      // 수집기가 없어도 결과 화면은 그대로다
}

        <p>${a.ask}</p>
      </div>`;}).join('')}
    </div>
    <div class="meta-row"><span>문항 <b>${N_Q}</b></span><span>응답 <b>O / X</b></span><span>소요 <b>약 3분</b></span><span>결과 <b>코드 ${AXIS_ORDER.length}자리</b></span></div>
    <div class="start-row">
      <button class="btn btn--go" id="start"><span>${resumable?'이어서 하기':'테스트 시작'}</span><b>↘</b></button>
      ${resumable?'<button class="btn btn--ghost" id="restart"><span>처음부터</span></button>':''}
      <a class="btn btn--ghost" href="levers.html"><span>레버 다섯 개 보기</span><b>→</b></a>
    </div>
    <div class="notice">
      <p>※ 실제로 존재하는 여러 사회적 입장에 대한 응답자의 '동의 여부'를 확인하는 것이므로, 일부 차별적이거나 과격하다고 느껴지는 문항이 있는 점을 참고하여 주시기 바랍니다. 측정값이 응답자의 실제 관점과 일치하지 않을 수 있습니다.</p>
      <p>※ 완료 시 익명 응답(O/X ${N_Q}개)만 저장됩니다 — 이름·연락처 등 개인 정보는 묻지도 받지도 않습니다. 결과 공유는 링크에 응답을 담는 방식입니다.</p>
      <p>※ 이 포맷은 웨이브 [사상검증구역: 더 커뮤니티] 시즌 1·2 테스트의 구조(축·강도·O/X)에서 영감을 받은 비상업 실험입니다.</p>
    </div>
  </section>`;
  document.getElementById('start').onclick = ()=>{ if(!resumable){step=0;ans={};} render(); };
  const r = document.getElementById('restart');
  if(r) r.onclick = ()=>{ step=0; ans={}; save(); render(); };
}
function answeredCount(){ return Object.keys(ans).length; }
function viewQuestion(st){
  const idx = STEPS.indexOf(st);
  const no = idx+1;
  const dispNo = String(no).padStart(2,'0');
  chrome(Math.round(no/N_Q*100), `${dispNo} / ${N_Q}`);
  const key = st.key;
  const text = TEXT[key];
  app.innerHTML = `
  <section class="qscreen">
    <div class="ghost" aria-hidden="true">${dispNo}</div>
    <div class="qmeta">
      <div class="slab"><span>${dispNo}</span><b>QUESTION</b></div>
      <span class="kbd-hint">KEYBOARD O / X</span>
    </div>
    <h1 class="qtext"><span class="qmark">Q.</span>${esc(text)}</h1>
    <div class="answers">
      <button data-v="O"><small>01</small><span class="mark">O</span><span>그렇다</span></button>
      <button data-v="X"><small>02</small><span class="mark">×</span><span>아니다</span></button>
    </div>
    <div class="backrow"><button class="back" id="back" ${idx===0?'disabled':''}>← 이전 문항</button></div>
  </section>`;
  for(const b of app.querySelectorAll('.answers button')){
    b.onclick = ()=>pick(key, b.dataset.v, b);
  }
  document.getElementById('back').onclick = ()=>{ if(step>0){ step--; render(); } };
}
let locking=false;
function pick(key, v, btn){
  if(locking) return; locking=true;
  ans[key]=v; btn.classList.add('sel');
  window.setTimeout(()=>{
    locking=false;
    if(step < STEPS.length-1){ step++; save(); render(); }
    else { save(); finish(); }
  }, 240);
}
function finish(){
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  const hex = encodeAns();
  const r = score();
  /* 익명 응답 수집. 로컬은 server.py가, 배포본은 COLLECTOR(우리 계정의 Worker)가 받는다 —
     사이트는 다른 계정의 Pages에서 도는데 수집기는 우리가 쥐고 있어야 해서 갈랐다.
     실패는 조용히 무시한다: 결과는 #r= 링크로 재현되므로 수집 여부와 무관하다. */
  const localhost = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const submitURL = localhost ? '/api/submit' : COLLECTOR + '/submit';
  try{
    fetch(submitURL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({v:2, qset:QSET, hex, code:r.code, ts:new Date().toISOString()})
    }).catch(()=>{});
  }catch(e){}
  history.replaceState(null,'','#r='+hex);
  viewResult();
}
function viewResult(){
  const r = score();
  chrome(100,'RESULT');
  app.innerHTML = `
  <section class="result">
    <div class="slab"><span>RESULT</span><b>FIVE LEVERS</b></div>
    <div class="res-card">
      <div class="res-head">
        <div class="slab"><span>01</span><b>CODE</b></div>
        <span>당신의 결과</span>
      </div>
      <div class="res-body">
        <figure class="symwrap" style="margin:0">
          ${symbolSVG(r.axes)}
          <figcaption>기울기 = 극 · 밀도 = 강도 · 점선 = 눈</figcaption>
        </figure>
        <div>
          <p class="res-code">${r.axes.map(o=>`${o.code}${o.intensity}`).join('<i>·</i>')}</p>
          <p class="res-sub">${r.axes.map(o=>o.ax[o.win].en+' '+o.intensity).join(' / ')}</p>
          <div class="axis-read">
            ${r.axes.map((o,i)=>{
              const lose = o.win==='L'?'R':'L';
              return `<div class="axis-row ${o.intensity===2?'hot':''}">
                <small>${String(i+1).padStart(2,'0')} ${o.ax.name}</small>
                <span class="who"><em>${o.ax[lose].ko}보다</em><b>${o.ax[o.win].ko}</b></span>
                <span class="pts">${o.intensity}<em>점</em></span>
              </div>`;
            }).join('')}
          </div>
          <div class="splits">
            ${r.axes.map(o=>`
              <div class="split-row">
                <span class="pole ${o.win==='L'?'win':''}">${o.ax.L.ko}<b>${o.ax.L.c}</b></span>
                <span class="track"><i class="l" style="width:${o.L/PER_AXIS*100}%"></i><i class="r" style="width:${o.R/PER_AXIS*100}%"></i><em>${o.L} : ${o.R}</em></span>
                <span class="pole r ${o.win==='R'?'win':''}"><b>${o.ax.R.c}</b>${o.ax.R.ko}</span>
              </div>`).join('')}
            <p class="split-note">축당 9문항 — 홀수라 동점이 없다. 좌우 격차 25% 이상(6:3부터)이면 강도 2. ※ 각 영역별 최대 2점까지 측정된다. 다섯 자리가 레버 다섯 개 — 다섯째(가치)만 손이 아니라 눈이라 점선으로 그린다.</p>
          </div>
        </div>
      </div>
    </div>

    <div id="stats"></div>

    <div class="share">
      <button class="btn btn--go" id="share"><span>결과 링크 복사</span><b>↗</b></button>
      <button class="btn btn--ghost" id="again"><span>다시 하기</span></button>
      <a class="btn btn--ghost" href="levers.html"><span>레버 다섯 개 보기</span><b>→</b></a>
      <span class="hint" id="share-hint">링크에 응답 ${N_Q}개가 담긴다 — 링크만으로 결과 재현</span>
    </div>

    <div class="foot">
      <p>※ 결과에서 사용하는 용어(가속·제동·개방·폐쇄·시장·주권·첨단·보편·역량·효용)는 이 테스트 안에서 정의한 것으로, 실제 용례와 다를 수 있다.</p>
      <p>※ 위 분포는 지금까지 쌓인 익명 응답을 실시간으로 읽은 것이다. 저장되는 값은 O/X 응답과 코드뿐이며, 이름·연락처·IP는 남기지 않는다. 이 페이지는 sudoremove 포맷 실험 프로토타입이다.</p>
    </div>
  </section>`;
  document.getElementById('share').onclick = async (e)=>{
    const url = location.href.split('#')[0] + '#r=' + encodeAns();
    const txt = `${url} 나의 기술 코드는 ${r.code} — 기술 사상검증구역`;
    let ok=false;
    try{ await navigator.clipboard.writeText(txt); ok=true; }catch(err){}
    document.getElementById('share-hint').textContent = ok ? '복사 완료 — 붙여넣어 공유' : url;
  };
  loadStats(r);
  document.getElementById('again').onclick = ()=>{
    ans={}; step=0; history.replaceState(null,'',location.pathname+location.search);
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    render(true);
  };
}
function render(forceIntro){
  if(forceIntro===true){ viewIntro(false); return; }
  viewQuestion(STEPS[step]);
  window.scrollTo(0,0);
}

/* ───────── keyboard ───────── */
window.addEventListener('keydown', e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  const btns = app.querySelectorAll('.answers button');
  if(!btns.length) return;
  const k = e.key.toLowerCase();
  if(k==='o'){ e.preventDefault(); btns[0].click(); }
  else if(k==='x'){ e.preventDefault(); btns[1].click(); }
  else if(e.key==='ArrowLeft'){ const b=document.getElementById('back'); if(b&&!b.disabled) b.click(); }
});

/* ───────── boot ───────── */
(function(){
  const m = location.hash.match(new RegExp('#r=([0-9a-f]{'+HEX_LEN+'})'));
  if(m && decodeAns(m[1])){ viewResult(); return; }
  const resumable = load();
  viewIntro(resumable);
})();
</script>
</body>
</html>
